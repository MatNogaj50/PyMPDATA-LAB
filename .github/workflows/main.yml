name: raport
on: push
jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - run: python -c "print('hello world!')"
      - uses: actions/checkout@v7
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          tinytex: true
      - run: pip install nbformat nbclient ipykernel
      - run: quarto render example.ipynb --execute --to pdf
      - uses: actions/upload-artifact@v7
        with:
          path: example.pdf
          archive: false
